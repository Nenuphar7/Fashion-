<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAVE — thermal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden;
      touch-action: none; overscroll-behavior: none; }
  body { background: rgb(128,124,134); }
  canvas#c { display: block; width: 100vw; height: 100vh; touch-action: none; }

</style>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@500&display=swap" rel="stylesheet">
<style id="wave-hud">
  :root{
    --m: clamp(18px, 2.8vw, 46px);
    --expw: clamp(196px, 22.95vw, 306px);
    --w1: rgba(255,255,255,.95);
    --w2: rgba(255,255,255,.6);
    --grotesk: "Space Grotesk", system-ui, sans-serif;
    --slogan-font: "Outfit", "Space Grotesk", system-ui, sans-serif;
  }
  .hud{ position:fixed; inset:0; z-index:10; pointer-events:none; color:var(--w1);
        font-family:var(--grotesk); -webkit-font-smoothing:antialiased; }
  .hud svg{ display:block; }

  .tc{ position:absolute; top:calc(var(--m) + 2px); left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap; }
  .tr{ position:absolute; top:var(--m); right:var(--m); text-align:right; }

  /* menu (top-left) — tap shows a white plaque */
  .menu{ position:absolute; top:var(--m); left:var(--m); display:flex; flex-direction:column; gap:.5em; pointer-events:auto; }
  .menu span{ font-weight:500; font-size: clamp(12px,1.2vw,15px); letter-spacing:.02em; color:var(--w1);
              display:inline-block; align-self:flex-start; padding:.14em .5em; margin-left:-.5em; cursor:pointer;
              transition: background .12s ease, color .12s ease; }
  .menu span:hover, .menu span:focus, .menu span:active{ background:#fff; color:#111; outline:none; }

  .eyebrow{ text-transform:uppercase; font-weight:500; color:var(--w1);
            font-size: clamp(11px,1.15vw,15px); letter-spacing:.3em; }
  .eyebrow .sh{ display:none; }

  .since{ font-weight:500; font-size: clamp(12px,1.2vw,15px); letter-spacing:.1em; color:var(--w1); }

  /* ultrasound scale (left edge, vertical center) */
  .scale{ position:absolute; left:calc(var(--m) - 6px); top:50%; transform:translateY(-50%);
          width: clamp(71px,8.1vw,105px); height: clamp(289px,61vh,561px); color:var(--w1);
          }
  .scale svg{ width:100%; height:100%; }

  /* right column — one container, everything aligned to the chain's (arrows) left edge */
  .rightcol{ position:absolute; right:var(--m); top:46%; bottom:var(--m);
             display:flex; flex-direction:column; align-items:flex-start; }
  .midR{ display:flex; flex-direction:row; gap: clamp(10px,1.2vw,17px); align-items:center;
         margin-bottom: clamp(16px,2.6vh,34px); }
  .midR .ic{ width: clamp(37px,4.08vw,53px); height: clamp(37px,4.08vw,53px);
             }

  .notes{ display:flex; flex-direction:row; gap: clamp(20px,2.4vw,42px); }
  .ncol{ display:flex; flex-direction:column; gap: clamp(10px,1.2vw,18px); }
  .note{ text-transform:uppercase; font-weight:400;
         font-size: clamp(9px,.92vw,12px); letter-spacing:.2em; line-height:1.5; color:#fff; }

  .spacer{ flex:1 1 auto; }
  .exp{ color:var(--w1); width: var(--expw); margin-bottom: clamp(12px,1.6vh,22px);
        }
  .exp svg{ width:100%; height:auto; }
  .chain{ display:flex; align-items:center; white-space:nowrap; color:var(--w1);
          font-weight:500; font-size: clamp(11px,1.1vw,15px); letter-spacing:.05em; }
  .chain .w{ display:inline-block; }
  .chain .ar{ width: 1.7em; height: .9em; margin:0 .3em; color:#fff; flex:0 0 auto; }

  /* slogan (bottom-left) */
  .sblock{ position:absolute; left:var(--m); bottom:var(--m); }
  .slogan{ font-family:var(--slogan-font); font-weight:500; color:#fff; line-height:1;
           letter-spacing:-.005em; white-space:nowrap; font-size: clamp(31px, 5.5vw, 77px); }

  @media (max-aspect-ratio: 1/1){
    .scale{ display:none; }
    .chain{ display:none; }
    .menu{ display:none; }
    .notes{ display:none; }
    .spacer{ display:none; }
    .rightcol{ display:contents; }
    .eyebrow .lg{ display:none; } .eyebrow .sh{ display:inline; }
    .eyebrow{ letter-spacing:.1em; font-size:10px; }
    .tc{ left:var(--m); transform:none; text-align:left; }
    .exp{ position:absolute; left:50%; transform:translateX(-50%); bottom:auto;
          top: clamp(92px,12vh,140px); width: clamp(210px,72vw,330px); margin-bottom:0; }
    .midR{ position:absolute; left:auto; right: calc(var(--m) - 4px); top:50%; transform:translateY(-50%);
           gap:12px; flex-direction:column; margin-bottom:0; }
    .midR .ic{ width: clamp(42px,11vw,54px); height: clamp(42px,11vw,54px); }
    .slogan{ font-size: clamp(29px, 8.28vw, 56px); }
  }
</style>

</head>

  function edt(seed, w, h) {
    const INF = 1e9;
    const gx = new Float32Array(w * h), gy = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) { if (seed[i]) { gx[i] = 0; gy[i] = 0; } else { gx[i] = INF; gy[i] = INF; } }
    const cmp = (ci, ni, ox, oy) => {
      const cdx = gx[ni] + ox, cdy = gy[ni] + oy;
      if (cdx * cdx + cdy * cdy < gx[ci] * gx[ci] + gy[ci] * gy[ci]) { gx[ci] = cdx; gy[ci] = cdy; }
    };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (x > 0) cmp(i, i - 1, -1, 0);
        if (y > 0) cmp(i, i - w, 0, -1);
        if (x > 0 && y > 0) cmp(i, i - w - 1, -1, -1);
        if (x < w - 1 && y > 0) cmp(i, i - w + 1, 1, -1);

  }

    try {
      const img = new Image();
      img.decoding = 'async';
      img.src = GRAD_SRC;
      await img.decode();
      uploadGrad(img);
    } catch (e) { fallbackGrad(); }
  }

  async function boot() {
    try {
      await Promise.race([
        (document.fonts && document.fonts.load)
          ? document.fonts.load('400 120px "Bagel Fat One"').then(() => document.fonts.ready)
          : Promise.resolve(),
        new Promise((r) => setTimeout(r, 2500)),
      ]);
    } catch (e) { /* fallback */ }
    lutTex = makeLUT();
    buildGlyphs();
    await loadGrad();
    resize();
    requestAnimationFrame(render);
  }
  boot();
})();
