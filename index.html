<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>The Fashion Founder's Blind Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Outfit:wght@400;500;600&family=Bagel+Fat+One&display=swap" rel="stylesheet"/>
<style>
  :root{--h-pale:#fdeec2;--h-yellow:#ffd24a;--h-orange:#ff8a1e;--h-red:#ff3b2f;--h-magenta:#e01e8a;--h-purple:#7a32c4;
    --ink:#fff;--ink-dim:rgba(255,255,255,.62);--ink-faint:rgba(255,255,255,.3);
    --hud:"Space Grotesk",system-ui,sans-serif;--display:"Outfit","Space Grotesk",sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#3f3f45;color:var(--ink);font-family:var(--hud);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;}
  #bg{position:fixed;inset:0;z-index:0;}
  #veil{position:fixed;inset:0;z-index:0;background:rgba(18,18,22,.82);pointer-events:none;}
  #stage{position:fixed;inset:0;z-index:1;}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s;display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,90px);}
  .slide.active{opacity:1;visibility:visible;}
  .eyebrow{position:absolute;top:clamp(16px,3.2vh,30px);left:clamp(18px,3.4vw,40px);font-size:clamp(12px,1.4vw,16px);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);font-weight:500;z-index:3;}
  .wavemark{position:absolute;bottom:clamp(14px,2.8vh,26px);left:clamp(18px,3.4vw,40px);font-family:"Bagel Fat One",cursive;font-size:clamp(18px,2vw,26px);background:linear-gradient(92deg,var(--h-yellow),var(--h-orange) 45%,var(--h-magenta));-webkit-background-clip:text;background-clip:text;color:transparent;z-index:3;opacity:.95;}
  .counter{position:absolute;bottom:clamp(14px,2.8vh,26px);right:clamp(18px,3.4vw,40px);font-size:clamp(12px,1.2vw,15px);letter-spacing:.16em;color:var(--ink-dim);z-index:3;font-variant-numeric:tabular-nums;}

  .wrap{width:min(94vw,1150px);}
  .kick{font-size:clamp(14px,1.6vw,20px);letter-spacing:.24em;text-transform:uppercase;color:var(--h-orange);font-weight:600;margin:0 0 clamp(14px,2.4vh,26px);}
  h1.big{font-family:var(--display);font-weight:500;line-height:1.04;margin:0;font-size:clamp(42px,6.6vw,96px);letter-spacing:-.01em;}
  h1.big em{font-style:normal;background:linear-gradient(96deg,var(--h-yellow),var(--h-orange) 42%,var(--h-magenta) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .subline{margin:clamp(16px,2.6vh,28px) 0 0;color:var(--ink-dim);font-size:clamp(22px,2.6vw,34px);max-width:40ch;line-height:1.4;}

  .items{list-style:none;margin:clamp(14px,2.6vh,26px) 0 0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,1.1vh,11px);}
  .items li{display:flex;gap:16px;align-items:baseline;padding:clamp(7px,1.1vh,12px) clamp(16px,1.8vw,22px);border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.04);}
  .items li .n{font-family:var(--hud);font-size:16px;color:var(--ink-faint);letter-spacing:.1em;min-width:26px;}
  .items li .t{font-family:var(--display);font-size:clamp(23px,2.7vw,37px);font-weight:500;}
  .items li .s{color:var(--ink-dim);font-size:clamp(17px,1.9vw,24px);margin-left:8px;font-family:var(--hud);}
  .items li.hot{border-color:var(--h-orange);background:linear-gradient(90deg,rgba(255,138,30,.2),rgba(224,30,138,.06));box-shadow:0 0 30px rgba(255,138,30,.15);}
  .items li.hot .t{color:var(--h-yellow);}
  .note{margin-top:clamp(14px,2.2vh,22px);font-size:clamp(18px,2.1vw,26px);color:var(--ink-dim);}
  .note b{color:var(--h-yellow);font-weight:600;}

  /* flow chips */
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(10px,1.4vw,18px);margin-top:clamp(16px,2.6vh,28px);}
  .chip{display:inline-flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:clamp(21px,2.5vw,34px);padding:clamp(12px,1.6vh,20px) clamp(18px,2vw,28px);border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.05);}
  .sep{color:var(--h-orange);font-size:clamp(22px,2.6vw,36px);}
  .bigq{margin-top:clamp(20px,3vh,34px);font-family:var(--display);font-weight:600;font-size:clamp(48px,7vw,110px);color:var(--h-yellow);}

  /* channels */
  .chan{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(12px,1.6vw,22px);margin-top:clamp(14px,2.4vh,24px);}
  .chan .b{border:1px solid var(--h-orange);border-radius:12px;padding:clamp(12px,1.6vh,20px) clamp(18px,2vw,28px);font-family:var(--display);font-size:clamp(20px,2.3vw,32px);}
  .chan .b span{display:block;color:var(--ink-dim);font-size:clamp(14px,1.5vw,18px);font-family:var(--hud);margin-top:4px;}
  .contrast{margin-top:clamp(16px,2.4vh,26px);display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .contrast div{padding:clamp(12px,1.6vh,18px) clamp(16px,1.8vw,22px);border-radius:12px;font-size:clamp(18px,2vw,26px);font-family:var(--display);}
  .contrast .bad{border:1px solid rgba(255,90,90,.4);color:#ff9a9a;}
  .contrast .good{border:1px solid rgba(120,220,170,.45);color:#8fe6b6;}

  /* not-def */
  .nots{margin-top:clamp(16px,2.6vh,26px);display:flex;flex-direction:column;gap:12px;}
  .nots .x{font-family:var(--display);font-size:clamp(24px,3vw,44px);color:var(--ink-dim);}
  .nots .x::before{content:"✕";color:#ff8f8f;margin-right:.5em;font-size:.8em;}
  .isline{margin-top:clamp(18px,2.6vh,28px);font-family:var(--display);font-weight:600;font-size:clamp(26px,3.2vw,46px);color:var(--h-yellow);}

  /* timeline */
  .tl{margin-top:clamp(16px,2.6vh,26px);display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px);}
  .tl .row{display:flex;align-items:center;gap:16px;font-family:var(--display);font-size:clamp(20px,2.4vw,32px);}
  .tl .dot{width:12px;height:12px;border-radius:50%;background:var(--h-orange);flex:none;box-shadow:0 0 14px var(--h-orange);}

  /* questions on cover */
  .qs{margin-top:clamp(18px,2.8vh,30px);display:flex;flex-direction:column;gap:10px;}
  .qs div{font-family:var(--display);font-size:clamp(20px,2.3vw,30px);color:var(--ink-dim);}
  .qs div::before{content:"—  ";color:var(--h-orange);}

  /* whoami / animation slot */
  .whoami{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(18px,3vh,32px);}
  .animbox{width:min(80vw,760px);height:min(46vh,420px);border:2px dashed rgba(255,255,255,.28);border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:14px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:20px;}
  .animbox iframe{width:100%;height:100%;border:0;border-radius:16px;}
  .who-name{font-family:var(--display);font-weight:600;font-size:clamp(40px,6vw,86px);}
  .who-role{color:var(--ink-dim);font-size:clamp(20px,2.4vw,32px);}

  /* iceberg captions */
  .icewrap{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px);width:100%;}
  .topnote{margin:0;font-family:var(--hud);font-size:clamp(15px,1.7vw,21px);letter-spacing:.06em;color:var(--ink-dim);text-align:center;max-width:60ch;}
  .icecap{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(21px,2.5vw,34px);text-align:center;}
  .icecap b{color:var(--h-yellow);}
  .logos{display:flex;gap:clamp(20px,3vw,44px);flex-wrap:wrap;justify-content:center;}
  .logos span{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,38px);letter-spacing:.02em;color:var(--ink);opacity:.9;}
  .berg-wrap{width:min(72vw,720px);}

  /* links + finale qr */
  .links{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(16px,2.6vh,28px);}
  .linkcard{width:min(94%,720px);display:flex;align-items:center;justify-content:space-between;gap:22px;text-decoration:none;color:var(--ink);border:1px solid var(--h-orange);border-radius:14px;padding:clamp(18px,2.2vw,28px) clamp(20px,2.3vw,32px);background:linear-gradient(120deg,rgba(255,138,30,.16),rgba(224,30,138,.05));font-family:var(--display);font-weight:500;font-size:clamp(23px,2.7vw,38px);transition:background .2s;}
  .linkcard:hover{background:linear-gradient(120deg,rgba(255,138,30,.3),rgba(224,30,138,.1));}
  .linkcard .arw{color:var(--h-yellow);font-size:1.2em;line-height:1;}
  .endqr{display:flex;align-items:center;gap:clamp(24px,3.4vw,48px);margin-top:clamp(20px,3vh,34px);flex-wrap:wrap;}
  .qrbox{background:#fff;padding:16px;border-radius:16px;line-height:0;box-shadow:0 8px 40px rgba(0,0,0,.45);}
  .qrbox img{width:clamp(170px,20vw,260px);height:auto;display:block;image-rendering:pixelated;}
  .qrmeta .handle{font-family:var(--display);font-weight:600;font-size:clamp(26px,3vw,44px);}
  .qrmeta .cta{color:var(--ink-dim);margin-top:10px;font-size:clamp(18px,2.1vw,28px);}

  .berg-wrap{width:min(96vw,1180px);}
  svg.berg{width:100%;height:auto;display:block;overflow:visible;}
  .layer{stroke:none;transition:fill .5s ease,opacity .5s ease;}
  #content{fill:#f6fafd;} #clothes{fill:#eaf3fa;} #carriers{fill:#d9e9f3;}
  #identity{fill:#7fb6d8;} #idea{fill:#5a9fc6;} #platform{fill:url(#depth);}
  .layer.dim{opacity:.14;}
  .facets{transition:opacity .5s ease;}
  .berg.painmode .facets,.berg.painmode .water{opacity:.12;}
  .contour{fill:none;stroke:#fff;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;}
  .water{fill:#2f6cb2;opacity:.30;}
  .waterline{stroke:#fff;stroke-width:2.4;vector-effect:non-scaling-stroke;}
  .waterline2{stroke:rgba(255,255,255,.4);stroke-width:1;vector-effect:non-scaling-stroke;}
  .wtick{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;}
  .wave{stroke:rgba(220,232,250,.4);stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke;}

  .lead{stroke:rgba(255,255,255,.7);stroke-width:1;vector-effect:non-scaling-stroke;}
  .lead-dot{fill:#fff;}
  .lbl{font-family:var(--hud);fill:#fff;font-size:17px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;transition:fill .5s ease;}
  .lbl .sub{font-size:13px;letter-spacing:.05em;fill:var(--ink-dim);text-transform:none;}
  .lblgrp.hidden{opacity:0;}
  .zoneh{font-family:var(--hud);fill:#fff;font-weight:500;text-transform:uppercase;}
  .zoneh .zt{font-size:19px;letter-spacing:.14em;}
  .zoneh .zs{font-size:14px;letter-spacing:.1em;fill:var(--ink-dim);}
  .zoneh.strat .zt{fill:var(--h-orange);}
  .zones.hidden{opacity:0;}

  .berg .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.98}50%{opacity:.66}}
  .berg.hot-content #content{fill:url(#heat);filter:url(#glow);}
  .berg.hot-clothes #clothes{fill:url(#heat);filter:url(#glow);}
  .berg.hot-carriers #carriers{fill:url(#heat);filter:url(#glow);}
  .berg.hot-identity #identity{fill:url(#heat);filter:url(#glow);}
  .berg.hot-idea #idea{fill:url(#heat);filter:url(#glow);}
  .berg.hot-platform #platform{fill:url(#heat);filter:url(#glow);}
  .berg.hot-content #lbl-content .lbl,.berg.hot-clothes #lbl-clothes .lbl,.berg.hot-carriers #lbl-carriers .lbl,
  .berg.hot-identity #lbl-identity .lbl,.berg.hot-idea #lbl-idea .lbl,.berg.hot-platform #lbl-platform .lbl{fill:var(--h-yellow);}


  .row2{display:flex;align-items:center;gap:clamp(24px,4vw,64px);}
  .row2 .txt{flex:1;min-width:0;}
  .headimg{width:min(40vw,430px);max-height:66vh;object-fit:contain;border-radius:16px;display:block;flex:none;background:#4d4d52;}
  .logorow{display:flex;gap:clamp(20px,3vw,48px);justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:clamp(20px,3vh,38px);}
  .logocol{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .logochip{background:#fff;border-radius:20px;padding:clamp(22px,3vw,42px);display:flex;align-items:center;justify-content:center;width:clamp(190px,22vw,300px);height:clamp(150px,17vw,220px);}
  .logochip img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;}
  .logoname{font-family:var(--display);font-size:clamp(18px,2vw,26px);color:var(--ink-dim);}
  .animfull{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
  .cicon{color:var(--h-orange);line-height:0;}
  .cicon svg{width:clamp(30px,3.6vw,52px);height:auto;display:block;}
  .chanhead{display:inline-flex;align-items:center;justify-content:center;}
  .chanhead img{height:clamp(120px,17vh,190px);width:auto;border-radius:14px;display:block;}
  #help{position:fixed;z-index:5;bottom:clamp(14px,2.8vh,26px);left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;display:flex;gap:1.4em;transition:opacity .4s;}
  #help b{color:var(--ink-dim);} #help.dim{opacity:0;}
  .nav{position:fixed;top:0;bottom:0;width:20%;z-index:4;cursor:pointer;background:transparent;border:0;}
  .nav.prev{left:0;} .nav.next{right:0;}
</style></head><body>
<canvas id="bg"></canvas><div id="veil"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7a32c4"/><stop offset="22%" stop-color="#e01e8a"/><stop offset="46%" stop-color="#ff3b2f"/><stop offset="68%" stop-color="#ff8a1e"/><stop offset="86%" stop-color="#ffd24a"/><stop offset="100%" stop-color="#fdeec2"/></linearGradient>
  <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6aa6cd"/><stop offset="55%" stop-color="#3f83b1"/><stop offset="100%" stop-color="#245a83"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>
<div id="stage"></div>
<button class="nav prev" aria-label="prev"></button><button class="nav next" aria-label="next"></button>
<div id="help"><span><b>&#8592; &#8594;</b> slides</span><span><b>F</b> fullscreen</span></div>
<script>
(function(){const c=document.getElementById('bg'),ctx=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const BW=176;let BH=99;const off=document.createElement('canvas'),octx=off.getContext('2d');let W,H,img,seeds=[];
 function seed(){seeds=[];for(let i=0;i<10;i++)seeds.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*0.0016,vy:(Math.random()-.5)*0.0016});}
 function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;BH=Math.max(48,Math.round(BW*innerHeight/innerWidth));off.width=BW;off.height=BH;img=octx.createImageData(BW,BH);}
 function compute(){const d=img.data,ar=BW/BH;for(let y=0;y<BH;y++)for(let xp=0;xp<BW;xp++){const nx=xp/BW,ny=y/BH;let d1=1e9,d2=1e9;for(let s=0;s<seeds.length;s++){const dx=(nx-seeds[s].x)*ar,dy=ny-seeds[s].y,dd=dx*dx+dy*dy;if(dd<d1){d2=d1;d1=dd;}else if(dd<d2){d2=dd;}}const e=(Math.sqrt(d2)-Math.sqrt(d1))*0.5,q=Math.min(1,Math.max(0,(e-0.004)/0.055)),L=0.22+(0.45-0.22)*q,v=Math.round(L*255);const idx=(y*BW+xp)*4;d[idx]=v;d[idx+1]=v;d[idx+2]=v+3;d[idx+3]=255;}octx.putImageData(img,0,0);}
 function paint(){ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,W,H);}
 function frame(){for(const s of seeds){s.x+=s.vx;s.y+=s.vy;if(s.x<0||s.x>1)s.vx*=-1;if(s.y<0||s.y>1)s.vy*=-1;}compute();paint();setTimeout(()=>requestAnimationFrame(frame),90);}
 addEventListener('resize',()=>{resize();compute();paint();});resize();seed();compute();paint();if(!reduce)frame();
})();

const CONTOUR="M350,100 L360,80 L388,104 L410,68 L430,45 L452,82 L478,60 L500,74 L522,98 L540,100 L565,128 L590,150 L660,235 L672,250 L705,320 L712,420 L705,460 L685,560 L645,650 L600,710 L565,778 L520,720 L470,675 L440,640 L405,675 L360,702 L315,650 L275,565 L235,500 L205,452 L190,420 L197,320 L205,250 L240,205 L310,150 L325,128 L350,100 Z";
const BERG = `

  </g>

  <path class="contour" d="${CONTOUR}"/>

  <!-- horizontal zone labels -->

const stage=document.getElementById('stage');let i=0;
function chrome(idx){return `<div class="eyebrow">The Fashion Founder\u2019s Blind Spot</div><div class="wavemark">wave</div><div class="counter">${String(idx+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;}
function title(s){return `<div class="wrap"><p class="kick">${s.kick}</p><h1 class="big">${s.h}</h1>${s.sub?`<p class="subline">${s.sub}</p>`:''}${s.qs?`<div class="qs">${s.qs.map(q=>`<div>${q}</div>`).join('')}</div>`:''}</div>`;}
function stmt(s){const inner=`${s.kick?`<p class="kick">${s.kick}</p>`:''}<h1 class="big">${s.h}</h1>${s.sub?`<p class="subline">${s.sub}</p>`:''}`;return s.img?`<div class="wrap"><div class="row2"><img class="headimg" src="${s.img}" alt=""><div class="txt">${inner}</div></div></div>`:`<div class="wrap">${inner}</div>`;}
function list(s){const li=s.items.map(it=>`<li class="${it.hot?'hot':''}">${it.n?`<span class="n">${it.n}</span>`:''}<span class="t">${it.tt}${it.s?`<span class="s">${it.s}</span>`:''}</span></li>`).join('');return `<div class="wrap">${s.kick?`<p class="kick">${s.kick}</p>`:''}<h1 class="big">${s.h}</h1><ul class="items">${li}</ul>${s.note?`<p class="note">${s.note}</p>`:''}</div>`;}
function flow(s){const ch=s.items.map((x,k)=>`${k?'<span class="sep">→</span>':''}<span class="chip">${s.icons?`<span class="cicon">${s.icons[k]}</span>`:''}${x}</span>`).join('');return `<div class="wrap"><p class="kick">${s.kick}</p><div class="flow">${ch}</div>${s.note?`<p class="note">${s.note}</p>`:''}${s.bigq?`<div class="bigq">${s.bigq}</div>`:''}</div>`;}
function channels(){return `<div class="wrap"><p class="kick">Where the money goes</p><h1 class="big">Channels only <em>carry</em> the brand.</h1><div class="chan"><div class="b">Brand<span>the substance</span></div><span class="sep">→</span><div class="b">Channels<span>SMM · ads · marketing</span></div><span class="sep">→</span><div class="chanhead"><img src="${HEAD}" alt="Buyer"/></div></div><div class="contrast"><div class="bad">Nothing to carry = wasted budget</div><div class="good">A formed brand = ads that actually work</div></div></div>`;}
function notdef(s){const inner=`<h1 class="big">${s.h}</h1><div class="nots">${s.nots.map(x=>`<div class="x">${x}</div>`).join('')}</div><p class="isline">${s.is}</p>`;return s.img?`<div class="wrap"><div class="row2"><img class="headimg" src="${s.img}" alt=""><div class="txt">${inner}</div></div></div>`:`<div class="wrap">${inner}</div>`;}
function timeline(s){return `<div class="wrap"><p class="kick">${s.kick}</p><div class="tl">${s.items.map(x=>`<div class="row"><span class="dot"></span>${x}</div>`).join('')}</div></div>`;}
function whoami(s){return `<iframe class="animfull" src="${ANIM}" title="Wave"></iframe>`;}
function logos(s){return `<div class="wrap"><p class="kick">${s.kick}</p><div class="logorow">${s.items.map(it=>`<div class="logocol"><div class="logochip"><img src="${it.img}" alt="${it.name}"/></div><div class="logoname">${it.name}</div></div>`).join('')}</div></div>`;}
function linkS(s){const lk=s.links.map(l=>`<a class="linkcard" href="${l.url}" target="_blank" rel="noopener">${l.label}<span class="arw">\u2197</span></a>`).join('');return `<div class="wrap">${s.kick?`<p class="kick">${s.kick}</p>`:''}<h1 class="big">${s.h}</h1><div class="links">${lk}</div></div>`;}
function ig(s){return `<div class="wrap" style="text-align:center"><div class="qrbox" style="display:inline-block"><img src="${IGQR}" alt="Instagram QR"/></div><div style="margin-top:26px;font-family:var(--display);font-weight:600;font-size:clamp(30px,3.6vw,56px)">${s.handle}</div></div>`;}
function ice(s){const tn=s.topnote?`<p class="topnote">${s.topnote}</p>`:'';const cap=s.caption?`<p class="icecap">${s.caption}</p>`:'';const lg=s.logos?`<div class="logos">${s.logos.map(x=>`<span>${x}</span>`).join('')}</div>`:'';return `<div class="wrap"><div class="icewrap">${tn}<div class="berg-wrap">${BERG}</div>${lg}${cap}</div></div>`;}
function applyIce(el,s){const svg=el.querySelector('svg.berg');if(!svg)return;(s.hot||[]).forEach(id=>{svg.classList.add('hot-'+id);const p=svg.querySelector('#'+id);if(p)p.classList.add('pulse');});(s.dim||[]).forEach(id=>{const p=svg.querySelector('#'+id);if(p)p.classList.add('dim');});if(!s.zones)svg.querySelector('.zones').classList.add('hidden');const all=s.labels==='all';LAYERS.forEach(id=>{const g=svg.querySelector('#lbl-'+id);const on=all||(Array.isArray(s.labels)&&s.labels.includes(id));if(!on&&g)g.classList.add('hidden');});if(s.detail){const g=svg.querySelector('#lbl-'+s.detail.layer);if(g){const t=g.querySelector('text');const NS='http://www.w3.org/2000/svg';const x=t.getAttribute('x');s.detail.lines.forEach(ln=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('class','sub');ts.setAttribute('x',x);ts.setAttribute('dy','20');ts.textContent=ln;t.appendChild(ts);});}}}

function body(s){switch(s.t){case 'title':return title(s);case 'stmt':return stmt(s);case 'list':return list(s);case 'flow':return flow(s);case 'channels':return channels();case 'notdef':return notdef(s);case 'timeline':return timeline(s);case 'whoami':return whoami(s);case 'logos':return logos(s);case 'link':return linkS(s);case 'ig':return ig(s);case 'ice':return ice(s);default:return stmt(s);}}
function render(){if(i<0)i=0;if(i>=S.length)i=S.length-1;const s=S[i];const el=document.createElement('div');el.className='slide';if(s.t==='whoami'){el.style.padding='0';el.innerHTML=body(s);}else{el.innerHTML=chrome(i)+body(s);}stage.innerHTML='';stage.appendChild(el);if(s.t==='ice')applyIce(el,s);requestAnimationFrame(()=>el.classList.add('active'));}
function go(d){i+=d;render();flash();}
document.querySelector('.nav.next').onclick=()=>go(1);document.querySelector('.nav.prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}else if(k==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}});
let ht;function flash(){const h=document.getElementById('help');h.classList.remove('dim');clearTimeout(ht);ht=setTimeout(()=>h.classList.add('dim'),2600);}
render();flash();
</script></body></html>
